# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: PromptForge Phase 2 prompt-engine deterministic regressions

prompts:
  - file://./prompt-template.txt

providers:
  - id: file://./mock-provider.mjs
    label: prompt-engine-local-mock

defaultTest:
  assert:
    - type: is-json
      value: file://./fixtures/canonical-output.schema.json
    - type: javascript
      value: file://./assertions.cjs

tests:
  - description: improve mode lightly rewrites while preserving intent
    vars:
      case_id: mode-improve
      mode: improve
      target_model: gemini
      selected_context: ""
      raw_prompt: "Improve this prompt: summarize the meeting notes for my manager."
      expected_behavior: improve
      expected_output:
        title: Meeting Notes Summary Prompt
        needs_clarification: false
        questions: []
        enhanced_prompt:
          "Summarize the meeting notes for my manager. Highlight decisions, action items, owners,
          deadlines, and open questions. Keep the summary concise and use only information from the
          notes."
        role: "Executive communication assistant"
        task: "Summarize meeting notes for a manager."
        context: ""
        constraints:
          - "Use only the meeting notes provided by the user."
          - "Preserve decisions, action items, owners, deadlines, and open questions."
        format: "Concise summary with bullets"
        tone: professional
        success_criteria:
          - "The manager can scan decisions and next steps quickly."
          - "No unprovided meeting facts are invented."
        explanation:
          - "Clarified the audience and summary contents."
          - "Kept the rewrite close to the original request."
        added:
          - "Audience"
          - "Summary sections"
        removed: []
        changed:
          - "Made the vague summarize request more specific."

  - description: enhance mode creates a full structured prompt with placeholders
    vars:
      case_id: mode-enhance
      mode: enhance
      target_model: gemini
      selected_context: "Audience: first-time webinar registrants."
      raw_prompt: "Create webinar follow-up copy."
      expected_behavior: enhance
      expected_output:
        title: Webinar Follow-Up Copy Prompt
        needs_clarification: false
        questions: []
        enhanced_prompt:
          "You are a lifecycle marketer. Create webinar follow-up copy for first-time webinar
          registrants. Write a subject line, preview text, and email body that thanks them for
          attending, summarizes the main value, offers [RESOURCE LINK], and invites them to [NEXT
          STEP]. Use placeholders for missing webinar, product, and proof details."
        role: "Lifecycle marketer"
        task: "Create webinar follow-up copy."
        context: "Audience: first-time webinar registrants."
        constraints:
          - "Use placeholders for missing webinar, product, resource, and next-step details."
          - "Preserve the follow-up-copy intent."
        format: "Subject line, preview text, email body"
        tone: friendly
        success_criteria:
          - "Copy is ready to edit for a webinar follow-up."
          - "Missing facts appear as bracketed placeholders."
        explanation:
          - "Added role, audience, channel format, and placeholder guidance."
        added:
          - "Role"
          - "Audience"
          - "Email structure"
          - "Placeholders"
        removed: []
        changed:
          - "Expanded a vague copy request into a full structured prompt."

  - description: refine mode asks questions for thin input
    vars:
      case_id: mode-refine
      mode: refine
      target_model: gemini
      selected_context: ""
      raw_prompt: "Make it better."
      expected_behavior: refine_questions
      expected_output:
        title: Clarify Thin Prompt
        needs_clarification: true
        questions:
          - "What should the prompt help create or improve?"
          - "Who is the intended audience?"
          - "What format should the final output use?"
        enhanced_prompt: ""
        role: ""
        task: "Clarify a thin prompt before rewriting it."
        context: ""
        constraints:
          - "Ask only for information required to preserve intent."
        format: "Clarifying questions"
        tone: professional
        success_criteria:
          - "Questions cover missing task, audience, and format."
          - "No facts are invented."
        explanation:
          - "The prompt is below the refine clarity threshold."
        added:
          - "Clarifying questions"
        removed: []
        changed:
          - "Returned questions instead of guessing."

  - description: shorten mode compresses while preserving constraints
    vars:
      case_id: mode-shorten
      mode: shorten
      target_model: gemini
      selected_context: ""
      raw_prompt:
        "Please make this prompt much shorter but keep the requirements to compare three pricing
        plans, include pros and cons, and end with one recommendation."
      expected_behavior: shorten
      expected_output:
        title: Short Pricing Plan Comparison Prompt
        needs_clarification: false
        questions: []
        enhanced_prompt:
          "Compare three pricing plans. For each, list key pros and cons. End with one
          recommendation and why."
        role: "Decision-support assistant"
        task: "Compare three pricing plans and recommend one."
        context: ""
        constraints:
          - "Compare exactly three pricing plans."
          - "Include pros and cons."
          - "End with one recommendation."
        format: "Compact comparison with final recommendation"
        tone: concise
        success_criteria:
          - "The shortened prompt preserves all explicit constraints."
          - "The enhanced prompt is materially shorter than the input."
        explanation:
          - "Removed filler while keeping the comparison, pros/cons, and recommendation
            requirements."
        added: []
        removed:
          - "Polite filler"
        changed:
          - "Condensed the prompt into direct instructions."

  - description: golden few-shot vague-to-structured remains schema-valid
    vars:
      case_id: few-shot-vague-to-structured
      mode: enhance
      target_model: gemini
      selected_context: "Product: self-serve analytics dashboard. Audience: SaaS operations leads."
      raw_prompt: "Write a launch email for our new analytics dashboard."
      expected_behavior: few_shot
      few_shot_id: vague-to-structured
      expected_output:
        title: Analytics Dashboard Launch Email
        needs_clarification: false
        questions: []
        enhanced_prompt:
          "You are a B2B SaaS lifecycle marketer. Write a launch email for a self-serve analytics
          dashboard aimed at SaaS operations leads. Focus on the practical value of faster
          visibility into team performance. Use a clear subject line, a concise opening, three
          benefit bullets, one proof or placeholder proof point, and a direct call to action. Keep
          the body under 180 words and use placeholders like [PRODUCT NAME] or [PROOF POINT] for
          missing facts."
        role: "B2B SaaS lifecycle marketer"
        task: "Write a concise launch email for a self-serve analytics dashboard."
        context: "Product: self-serve analytics dashboard. Audience: SaaS operations leads."
        constraints:
          - "Keep the body under 180 words."
          - "Use placeholders for missing product name and proof point."
          - "Preserve the launch-email intent."
        format: "Subject line, email body, benefit bullets, call to action"
        tone: professional
        success_criteria:
          - "Makes the dashboard value clear to SaaS operations leads."
          - "Includes a direct call to action."
          - "Uses placeholders instead of invented facts."
        explanation:
          - "Added role, audience, format, and length constraints."
          - "Used selected context to avoid inventing product details."
        added:
          - "Role"
          - "audience"
          - "benefit bullets"
          - "CTA"
          - "placeholders"
        removed: []
        changed:
          - "Turned a vague request into a structured launch-email prompt."

  - description: golden few-shot refine-to-questions remains schema-valid
    vars:
      case_id: few-shot-refine-to-questions
      mode: refine
      target_model: gemini
      selected_context: ""
      raw_prompt: "Make this better for my clients."
      expected_behavior: few_shot_refine
      few_shot_id: refine-to-questions
      expected_output:
        title: Clarify Client-Facing Prompt
        needs_clarification: true
        questions:
          - "What should the prompt help your clients create or decide?"
          - "Who are the clients, and what level of expertise should the output assume?"
          - "What format should the final answer use?"
        enhanced_prompt: ""
        role: ""
        task: "Clarify a thin client-facing prompt before rewriting it."
        context: ""
        constraints:
          - "Ask only for information needed to preserve intent."
        format: "Clarifying questions"
        tone: professional
        success_criteria:
          - "Questions identify the missing task, audience, and format."
          - "No business facts are invented."
        explanation:
          - "The input is too thin for a reliable rewrite."
          - "Refine mode asks targeted questions before enhancement."
        added:
          - "Clarifying questions"
        removed: []
        changed:
          - "Deferred the rewrite until the user's goal is clear."

  - description: golden few-shot shorten remains schema-valid
    vars:
      case_id: few-shot-shorten-preserve-constraints
      mode: shorten
      target_model: gemini
      selected_context: ""
      raw_prompt:
        "Please rewrite this prompt so it is much shorter, but keep the requirement to compare three
        options, mention risks, and end with a recommendation."
      expected_behavior: few_shot_shorten
      few_shot_id: shorten-preserve-constraints
      expected_output:
        title: Concise Comparison Prompt
        needs_clarification: false
        questions: []
        enhanced_prompt:
          "Compare three options. For each, summarize the main benefit, key risk, and best-fit use
          case. End with one recommendation and the reason."
        role: "Decision-support assistant"
        task: "Compare three options and recommend one."
        context: ""
        constraints:
          - "Keep the prompt short."
          - "Compare exactly three options."
          - "Mention risks."
          - "End with a recommendation."
        format: "Compact comparison with final recommendation"
        tone: concise
        success_criteria:
          - "Preserves the three-option comparison."
          - "Includes risks and a recommendation."
          - "Uses substantially fewer words than the original request."
        explanation:
          - "Compressed the wording while preserving all explicit requirements."
          - "Kept the output format concrete."
        added:
          - "Best-fit use case"
          - "reason for recommendation"
        removed:
          - "Polite filler"
        changed:
          - "Condensed the request into a direct reusable prompt."
