name: CI

on:
  pull_request:

jobs:
  foundation:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  promptfoo-eval:
    name: Promptfoo eval stub
    runs-on: ubuntu-latest
    steps:
      - name: No-op until Phase 2
        run: echo "Promptfoo evals are stubbed until Phase 2."
